[package]
name = "windows_shell"
default-run = "windows_shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
audio_out = { path = "../audio_out" }
effect_vm = { path = "../effect_vm" }
area_sim = { path = "../area_sim" }
field_collision = { path = "../field_collision" }
event_sim = { path = "../event_sim" }
package_reader = { path = "../package_reader" }
player_sim = { path = "../player_sim" }
source_identity = { path = "../source_identity" }
skate_source = { path = "../skate_source" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log", "bevy_asset", "bevy_window", "bevy_winit", "bevy_render", "bevy_camera", "bevy_image", "bevy_sprite", "bevy_sprite_render", "bevy_core_pipeline", "bevy_pbr", "bmp", "bevy_gilrs"] }

[lints]
workspace = true
